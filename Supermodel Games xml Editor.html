<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supermodel Games xml Editor.html</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
  }
  p {
    margin-left: 20px;
    margin-top: 20px;
    margin-bottom: 20px;
    font-size: 300%
  }
  .parent {
    margin-left: 10px;
    margin-top: 20px;
    margin-bottom: 4px;
    zoom: 1.6;
  }
  .child {
    margin-left: 25px;
    margin-bottom: 8px;
  }
  .button {
    margin-left: 20px;
  }
</style>
</head>
<body>
  <p id="messageOutput" ></p>
  <button id="deselectAll" class="button">Uncheck all</button>
  <button id="selectAll" class="button">Check all</button>
  <button id="parentsOnly" class="button">Parents only</button>
  <button id="fanFavs" class="button">Fan favourites</button>
  <button id="dlXmlButton" class="button">Download Games.xml</button>
  <button id="dlDatButton" class="button">Download ROM dat file</button>
  <div id="game-list"></div><br>
<script>
	const messageOutputElement = document.getElementById('messageOutput');
	const message = (messageInfo) => {
		messageOutputElement.textContent = messageInfo;
		console.log(messageInfo);
	}

	const deselectAll = document.getElementById("deselectAll");
		deselectAll.addEventListener("click", function () {
			selectAllBoxes(false);
	});

	const selectAll = document.getElementById("selectAll");
		selectAll.addEventListener("click", function () {
			selectAllBoxes(true);
	});

	const parentsOnly = document.getElementById("parentsOnly");
		parentsOnly.addEventListener("click", function () {
			parentBoxesOnly();
	});

	const fanFavs = document.getElementById("fanFavs");
		fanFavs.addEventListener("click", function () {
			fanFavBoxesOnly();
	});

	const dlXmlBtnElement = document.getElementById("dlXmlButton");
		dlXmlBtnElement.addEventListener("click", function () {
			downloadXmlBtnFunc();
	});

	const dlDatBtnElement = document.getElementById("dlDatButton");
		dlDatBtnElement.addEventListener("click", function () {
			downloadDatBtnFunc();
	});

	function selectAllBoxes(choice) {
		const checkboxes = document.querySelectorAll('input[type="checkbox"]');
		checkboxes.forEach(checkbox => {
			checkbox.checked = choice;
		});
	}

	function fanFavBoxesOnly() {
		const checkboxes = document.querySelectorAll('input[type="checkbox"]');
		checkboxes.forEach(checkbox => {
			switch(checkbox.id) {
				case 'daytona2':
				case 'dayto2pe':
				case 'lamachin':
				case 'lostwsga':
				case 'scud':
				case 'srally2':
				case 'swtrilgy':
					checkbox.checked = true;
					break;
				default:
					checkbox.checked = false;
			}
		});
	}

	function parentBoxesOnly() {
		const parentboxes = document.querySelectorAll('div.parent input[type="checkbox"]');
		parentboxes.forEach(checkbox => {
			checkbox.checked = true;
		});

		const childboxes = document.querySelectorAll('div.child input[type="checkbox"]');
		childboxes.forEach(checkbox => {
			checkbox.checked = false;
		});
	}

	async function downloadXmlBtnFunc() {
		const gamesToRemoveArray = await downloadShared();
			const xmlContent = await removeNode(gamesToRemoveArray);
			downloadFile(xmlContent, "Games.xml");
	}

	async function downloadDatBtnFunc() {
		const gamesToRemoveArray = await downloadShared();
		if ((gamesToRemoveArray.includes('mgtrkbad')) == false) {
			gamesToRemoveArray.push('mgtrkbad');
		}
		const xmlContentString = await removeNode(gamesToRemoveArray);
		if (!Object.keys(romsByCrc).length) {
			romsByCrc = await fetchMameFilesFromUrl();
		}
		parseGamesxml(romsByCrc, xmlContentString);
	}

	function downloadShared() {
		editedGamesxmlDoc = fullGamesxmlDoc.cloneNode(true);
		const checkedBoxes = document.querySelectorAll('input[type="checkbox"]:checked');

		if (checkedBoxes.length == 0)  {
			alert(`No games are selected`);
			return
		}

		const uncheckedBoxes = document.querySelectorAll('input[type="checkbox"]:not(:checked)');
		const gamesToRemove = [];

		uncheckedBoxes.forEach(checkbox => {
			gamesToRemove.push(checkbox.id);
		});
		return gamesToRemove;
	}

	function checkboxClicked() {
		var gameName = event.target.name;
		var relation = event.target.parentNode.className;

		if (relation == 'parent') {
			if (!event.target.checked) {
				const selected = document.querySelectorAll(`input[name="${gameName}"]`);
				selected.forEach(checkbox => {
					checkbox.checked = false;
				});
			}
		} else if (relation == 'child') {
			if (event.target.checked) {
				document.getElementById(gameName).checked = true;
			}
		}
	}

	async function fetchGamesxml() {
		const gamesXmlUrl = "https://raw.githubusercontent.com/trzy/Supermodel/refs/heads/master/Config/Games.xml";
		message(`Fetching Games.xml content`);
		console.log(`Fetching content from: ${gamesXmlUrl}`);
		const content = await getFileContent(gamesXmlUrl);
		if (!content) {
			errorMessage();
			alert(`Error fetching Games.xml from repo\nRefresh the page to try again`);
			return
		} else {
			const parser = new DOMParser();
			fullGamesxmlDoc = parser.parseFromString(content, 'text/xml');

      ///////////////// Remove Lost World Gun Fuckery /////////////////
      const games = fullGamesxmlDoc.querySelectorAll('game');

      games.forEach(gameNode => {
          const titleEl = gameNode.querySelector('title').textContent;

          if (titleEl == "The Lost World") {
            const inputs = gameNode.querySelectorAll('input');
            inputs.forEach(input => {
              const typeValue = input.getAttribute("type");

              if (typeValue && typeValue.startsWith("analog_gun")) {
                const newTypeValue = typeValue.replace("analog_gun", "gun");
                input.setAttribute("type", newTypeValue);
              }
            });
          }
      });
      /////////////////////////////////////////////////////////////////

			editedGamesxmlDoc = fullGamesxmlDoc.cloneNode(true);
			const allGameNodes = editedGamesxmlDoc.querySelectorAll('game[name]');

			console.log(`\n${allGameNodes.length} games found`);

			const childRoms = [];
			const parentRoms = [];
			var allRoms = [];

			allGameNodes.forEach(node => {
				const gameFound = node.getAttribute('name');
				const parentFound = node.getAttribute('parent');
				const childrenArray = [];
				const titleFound = node.querySelector('title').textContent;
				const versionFound = node.querySelector('version').textContent;
				const yearFound = node.querySelector('year').textContent;

				const gameInfo = {
          title: titleFound,
          version: versionFound,
          year: yearFound,
          relation : "",
          children: childrenArray
				}

				allRoms[gameFound] = gameInfo;

				if (parentFound) {
					childRoms.push(gameFound);
					allRoms[parentFound].children.push(gameFound);
					delete allRoms[gameFound].children;
					allRoms[gameFound].relation = "child";
					allRoms[gameFound].parent = parentFound;
				}
				else {
					parentRoms.push(gameFound);
					allRoms[gameFound].relation = "parent";
				}
			});

			console.log(`\n${parentRoms.length} parents\n${childRoms.length} children`);
		}

		const romSetContainer = document.getElementById("game-list");

		for (const [key, value] of Object.entries(allRoms)) {
			const romSetName = [key];
			const romSetObj = allRoms[key];
			const familyNames = [];

			if (romSetObj['relation'] == 'parent') {
				familyNames.push(romSetName);
			}
			if (romSetObj['children'] && romSetObj['children'] != 0) {
				romSetObj['children'].forEach(item => {
					familyNames.push(item);
				});
			}
			if (familyNames != 0) {
				console.log(`${familyNames}`);
			}

			familyNames.forEach(item => {

				const itemDiv = document.createElement('div');

				const checkbox = document.createElement('input');
				checkbox.type = 'checkbox';
				checkbox.checked = true;
				checkbox.id = item;
				checkbox.name = romSetName;

				checkbox.addEventListener("click", checkboxClicked);

				if (checkbox.id == checkbox.name) {
					itemDiv.classList.add('parent');
				} else {
					itemDiv.classList.add('child');
				}

				const label = document.createElement('label');
				label.htmlFor = item;
				label.textContent = `${item} - ${allRoms[item]['title']} (${allRoms[item]['version']})`;

				itemDiv.appendChild(checkbox);
				itemDiv.appendChild(label);;

				romSetContainer.appendChild(itemDiv);
			});
		}
		message(`Select games to keep`);
	}

	async function fetchMameFilesFromUrl(content) {
		message(`Fetching MAME driver content`);
		let RomsFound = 0;
		const regex = /"(.*?)",\s*0x[0-9a-fA-F]+\s*,\s*0x([0-9a-fA-F]+)\s*,\s*CRC\(([0-9a-fA-F]{8})\)\s*SHA1\(([0-9a-fA-F]{40})\)/;
		const MameUrl = "https://raw.githubusercontent.com/mamedev/mame/master/src/mame/sega/";
		const mameDrivers = ["model3.cpp", "segabill.cpp", "model2.cpp"];
		let len = mameDrivers.length;
		for (let i = 0; i < len; i++) {
			console.log(`Fetching content from: ${MameUrl + mameDrivers[i]}`);
			const content = await getFileContent(MameUrl + mameDrivers[i]);
			if (!content) {
				errorMessage();
				alert(`Error fetching ${mameDrivers[i]}\nRefresh the page to try again`);
				return
			}
			else {
				console.log(`Finding CRCs and collecting SHA-1 and size info from ${mameDrivers[i]}\n`);
				const lines = content.split(/\r?\n/);
				for (const line of lines) {
					if (line.trimStart().substring(0, 8) == "ROM_LOAD") {
						const match = line.match(regex);
						if (match) {
							RomsFound += 1;
							const filename = match[1].toLowerCase();
							const romNameArray = [filename];
							const size = parseInt(match[2], 16);
							const crc = match[3].toLowerCase();
							const sha1 = match[4].toLowerCase();
							const foundRom = romsByCrc[crc];
							if (foundRom) {
								if ((romsByCrc[crc].romNames.includes(filename)) == false) {
									romsByCrc[crc].romNames.push(romNameArray);
								}
							} else {
								const romInfo = {
									romNames: romNameArray,
									size: size,
									sha1: sha1
								}
								romsByCrc[crc] = romInfo;
							}
						}
					}
				}
			}
		}
		console.log(`${RomsFound} MAME ROMs parsed`);
		if (Object.keys(romsByCrc).length) {
			console.log(`${Object.keys(romsByCrc).length} Unique CRCs found\n`);
		} else {
			errorMessage();
			alert(`Error creating CRC info\nRefresh the page to try again`);
			return
		}
		message(`Select games to keep`);
		return romsByCrc;
	}

	async function parseGamesxml(romsByCrc, gamesXmlString) {
			message(`Parsing Games.xml`);
			console.log(`Adding SHA-1 and size info to the matching CRCs\n`);
			let datContent = "";
			const lines = gamesXmlString.split(/\r?\n/);
			for (const line of lines) {
				if (line.includes(`<game name=`)) {
					if (datContent) {
						datContent += `\t</machine>\n`;
					}
					const gameMatch = line.match(/"([^"]*)"/);
					datContent += `\n\t<machine name="${gameMatch[1]}">\n`;
				}
				else if (line.includes(`<title>`)) {
					const titleMatch = line.match(/>([^]*)</);
					datContent += `\t\t<description>${titleMatch[1]} `;
				}
				else if (line.includes(`<version>`)) {
					const versionMatch = line.match(/>([^]*)</);
					datContent += `(${versionMatch[1]})</description>\n`;
				}
				else if (line.includes(`<year>`)) {
					const trimLine = line.trim();
					datContent += `\t\t${trimLine}\n\t\t<manufacturer>Sega</manufacturer>\n`;
				}
				else if (line.includes(`<region name=`)) {
					const trimLine = line.trim();
					const splitLine = trimLine.split('"');
					if (line.includes(`required="false"`)) {
						datContent += `\t\t<!--region name="${splitLine[1]}" required="false"-->\n`; // Keep reminding people
					}
					else {
						datContent += `\t\t<!--region name="${splitLine[1]}"-->\n`;
					}
				}
				else if (line.includes(`<file offset=`)) {
					const splitLine = line.split('"');
					const crcTrim = splitLine[5].replace("0x", "").toLowerCase();
					if (romsByCrc[crcTrim]) {
						if ((romsByCrc[crcTrim].romNames.includes(splitLine[3].toLowerCase())) == false) {
							console.log(`\nMismatch in crc ${crcTrim}\nSupermodel name: ${splitLine[3]}\nMAME driver name(s): ${romsByCrc[crcTrim].romNames.join(", ")}`);
						}

						datContent += `\t\t<rom name="${splitLine[3]}" size="${romsByCrc[crcTrim].size}" crc="${crcTrim}" sha1="${romsByCrc[crcTrim].sha1}"/>\n`;
					}
					else {
						let notFound = `\t\t<rom name="${splitLine[3]}" crc="${crcTrim}"/> <!-- ${`#`.repeat(16)} NOT FOUND IN MAME ${`#`.repeat(16)} -->\n`;
						datContent += notFound;
						const lineChar = `*`;
						console.log(`${lineChar.repeat(52)} WARNING ${lineChar.repeat(52)}\n\nSupermodel is using a ROM not found in MAME, SHA-1 and size info will have to be added to the dat file manually.\n\n${notFound.trim()}\n\n${lineChar.repeat(113)}\n`);
					}
				}
			}

			if (!datContent) {
				errorMessage();
				alert(`Error creating dat output\nRefresh the page to try again`)
				return
			}

			const date = new Date();
			const month = (`0` + `${date.getMonth() + 1}`).slice(-2);
			const day = (`0` + `${date.getDate()}`).slice(-2);
			let header =
			`<?xml version="1.0" encoding="UTF-8"?>\n` +
			`<datafile>\n` +
			`\t<header>\n` +
			`\t\t<name>Supermodel</name>\n` +
			`\t\t<description>Sega Model 3 Emulator</description>\n` +
			`\t\t<category>Arcade</category>\n` +
			`\t\t<date>${date.getFullYear()}-${month}-${day}</date>\n` +
			`\t\t<author>Supermodel Games xml Editor.html</author>\n` +
			`\t\t<url>https://github.com/ToBul/Supermodel-Games-xml-Editor.html</url>\n` +
			`\t\t<comment>Matches Supermodel's Games.xml with mgtrkbad removed. (Edited)</comment>\n` +
			`\t</header>\n`;

			let footer =
			`\t</machine>\n` +
			`</datafile>`;

			let datOutput = header + datContent + footer;

			downloadFile(datOutput, "Supermodel.dat");
			message(`Select games to keep`);
	}

	async function getFileContent(url) {
		try {
			const response = await fetch(url);
			if (!response.ok) {
				throw new Error(`HTTP error! status: ${response.status}`);
			}
			const fileContent = await response.text();
			return fileContent;
		} catch (error) {
			console.error(`Error fetching ${url}`, error);
			return null;
		}
	}

	function errorMessage() {
		document.write("<html><head><title>error</title></head><body>");
		document.write("<h1 style='margin-left: 20px;margin-top: 30px;' >Error!</h1>");
		document.write("<p style='margin-left: 20px' >Refresh the page to try again.</p>");
		document.write("</body></html>");
	}

	function removeNode(nodeArray) {
		console.log(`number of games to remove: ${nodeArray.length}`);

		for (let i = 0; i < nodeArray.length; i++) {
			const nodeToRemove = editedGamesxmlDoc.querySelector(`game[name="${nodeArray[i]}"]`);

			if (nodeToRemove) {
				console.log(`Removing ${nodeArray[i]} from Games.xml`);
				nodeToRemove.parentNode.removeChild(nodeToRemove);
			}
		}

		// Convert the updated XML document back to a string
		const gamesXmlString = new XMLSerializer().serializeToString(editedGamesxmlDoc).replace("--><games>", "-->\n<games>").replaceAll("/>", " />").replaceAll("\n  \n", "");
		return gamesXmlString;
	}

	function downloadFile(FileContent, FileName) {
		//create an invisible element
		let element = document.createElement('a');

		element.setAttribute('href',
			'data:xml;charset=utf-8, '
			+ encodeURIComponent(FileContent));

		element.setAttribute('download', FileName);
		document.body.appendChild(element);
		element.click();

		document.body.removeChild(element);
	}

	let fullGamesxmlDoc = "";
	let editedGamesxmlDoc = "";
	let romsByCrc = {};

	fetchGamesxml();
</script>
</body>
</html>
